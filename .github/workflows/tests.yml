name: CPU protocol and interface tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install EGL software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - run: python -m pip install -e '.[test]' opencv-python-headless==4.11.0.86 mujoco==3.2.6
      - run: python -m pytest
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
