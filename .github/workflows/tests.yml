name: CPU protocol and interface tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mondo-Robotics/DiT4DiT
          ref: 66a6f3a12e2c8740157c1e478795952c040d31dd
          path: external/dit4dit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install EGL software renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      - run: python -m pip install -e '.[test,client]' opencv-python-headless==4.11.0.86 mujoco==3.2.6
      - name: Prepare and verify the pinned CC0 asset pack
        run: gr1-plus assets fetch --cache external/v3-assets
      - run: python -m pytest
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
          GR1_PLUS_ASSET_CACHE: ${{ github.workspace }}/external/v3-assets
          DIT4DIT_TEST_ROOT: ${{ github.workspace }}/external/dit4dit
